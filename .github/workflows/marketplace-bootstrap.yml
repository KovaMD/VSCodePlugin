name: Marketplace Bootstrap (one-time, delete after use)

# Run this once, manually, after Phase B/C of the Entra ID setup are done.
# It prints the Azure DevOps profile id the Marketplace needs to register
# the managed identity as a publisher member. Delete this file once you've
# copied the id and added it in marketplace.visualstudio.com/manage.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Print Azure DevOps profile id
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id -o tsv
